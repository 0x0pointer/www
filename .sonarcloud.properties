# This is a static, hand-maintained multi-page site with no build step or
# templating. The <head>, <nav>, <footer>, and small init <script> blocks are
# intentionally repeated on every page, and the section stylesheets (blog.css,
# projects/projects.css) mirror the base tokens/components by design. That
# structural repetition is expected, so exclude HTML and CSS from copy-paste
# (duplication) detection.
sonar.cpd.exclusions=**/*.html,**/*.css
